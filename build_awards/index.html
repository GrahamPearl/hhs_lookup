<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Sport / Culture / Service Team Manager</title>

    <!-- Styles -->
    <link rel="stylesheet" href="../css/style.css" />
    <link rel="stylesheet" href="../css/teams.css" />

    <!-- XLSX + JSZip (already used by the project) -->
    <script src="xlsx.full.min.js"></script>
    <script src="jszip.min.js"></script>
  </head>
  <body>
    <h1>School Award Manager</h1>
    <h4>This builder is browser based. <br>Export and Import to move to other devices</h4> <!-- fixed closing tag -->

    <div class="controls">
      <label for="activitySelect">Award</label>
      <select id="activitySelect"></select>

      <label for="agegroupSelect">Reg Class</label>
      <select id="agegroupSelect"></select>

      <input id="adminInput" placeholder="Admin No" />

      <button onclick="addStudent()">Add</button>
      <button onclick="removeStudent()">Delete</button>
      <button onclick="exportTeam()">Export JSON</button>
      <button onclick="exportTeamExcel()">Export Excel</button>
      <input type="file" id="importFile" />
      <button onclick="importTeam()">Import</button>
      <button onclick="printTeam()">Print Class Sheet</button>
    </div>

    <h2 id="teamTitle"></h2>
    <div id="team"></div>

    <!-- Vendor JS -->
    <script src="../js/jquery-4.0.0.min.js"></script>
    <script src="../js/bootstrap.bundle.min.js"></script>

    <!-- App JS -->
    <script src="../js/awards-listing.js"></script>
  </body>
</html>
