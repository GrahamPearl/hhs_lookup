<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cover Management Dashboard</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

<style>
body { background:#f4f6f9; }
.sidebar { height:100vh; background:#1e293b; color:white; padding:15px; }
.cell { border:1px solid #ccc; padding:10px; cursor:grab; }
.free { background:#d1fae5; }
.lesson { background:#dbeafe; }
</style>
</head>

<body>
<div class="container-fluid">
<div class="row">

<div class="col-md-3 sidebar">
<h4>Cover System</h4>

<h5>Absence</h5>
<select id="absenceTeacherSelect" class="form-select mb-2"></select>
<select id="absenceDaySelect" class="form-select mb-2">
<option value="0">Day 1</option>
<option value="1">Day 2</option>
<option value="2">Day 3</option>
<option value="3">Day 4</option>
<option value="4">Day 5</option>
</select>

<button id="checkBtn" class="btn btn-info w-100 mb-2">Check Cover</button>

<div id="best" class="alert alert-success d-none"></div>
<div id="results"></div>

<hr>

<h5>Bulk Import</h5>
<button id="bulkBtn" class="btn btn-primary w-100 mb-2">Import Folder</button>
<input type="file" id="bulkInput" webkitdirectory multiple class="d-none">
<div id="status"></div>

</div>

<div class="col-md-9 p-3">
<h5>Drag & Drop Coverage</h5>
<div id="grid" class="row"></div>
</div>

</div>
</div>

<script src="script.js"></script>
</body>
</html>
