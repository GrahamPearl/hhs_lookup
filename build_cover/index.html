<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cover Management Dashboard</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
<style>
body { background:#f4f6f9; }
.sidebar { height:100vh; background:#1e293b; color:white; padding:15px; }
.cell { border:1px solid #ccc; padding:10px; }
.free { background:#d1fae5; }
.lesson { background:#dbeafe; }
.meeting { background:#fef3c7; }
.avail-badge { cursor: grab; }
.assigned { background:#fde68a; }
</style>
</head>
<body>
<div class="container-fluid">
<div class="row">

<div class="col-md-3 sidebar">
<h4>Cover System</h4>
<select id="absenceDaySelect" class="form-select mb-2">
	<option value="0">Day 1</option>
	<option value="1">Day 2</option>
	<option value="2">Day 3</option>
	<option value="3">Day 4</option>
	<option value="4">Day 5</option>
</select>

<h5>Absent Teachers</h5>
<div class="input-group mb-2">
	<select id="addAbsenceTeacherSelect" class="form-select"></select>
	<button id="addAbsenceTeacherBtn" class="btn btn-primary">Add</button>
</div>

<table class="table table-bordered mb-2" id="absentTeachersTable">
	<thead>
		<tr><th>Teacher</th><th>Actions</th></tr>
	</thead>
	<tbody></tbody>
</table>


<button id="saveBtn" class="btn btn-success w-100 mb-2">Save Plan</button>
<button id="printBtn" class="btn btn-secondary w-100 mb-2">Print Plan</button>
<div class="input-group mb-2">
	<input type="email" id="emailInput" class="form-control" placeholder="Email address">
	<button id="emailBtn" class="btn btn-info">Email Table</button>
</div>

<hr>

<h5>Bulk Import</h5>
<button id="bulkBtn" class="btn btn-primary w-100 mb-2">Import Folder</button>
<input type="file" id="bulkInput" webkitdirectory multiple class="d-none">
<div id="status"></div>

<button id="clearBtn" class="btn btn-danger w-100 mb-2">Clear All Data</button>

</div>

<div class="col-md-9 p-3">
<h5>Cover Allocation</h5>
<div id="coverGrid"></div>
<h6 class="mt-4">Available Cover Teachers</h6>
<div id="availableCoverList" class="mb-3"></div>

<!-- Print Preview Modal -->
<div class="modal fade" id="printPreviewModal" tabindex="-1" aria-labelledby="printPreviewLabel" aria-hidden="true">
	<div class="modal-dialog modal-lg">
		<div class="modal-content">
			<div class="modal-header">
				<h5 class="modal-title" id="printPreviewLabel">Print Preview</h5>
				<button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
			</div>
			<div class="modal-body" id="printArea"></div>
			<div class="modal-footer">
				<button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
				<button type="button" class="btn btn-primary" id="confirmPrintBtn">Print</button>
			</div>
		</div>
	</div>
</div>
</div>

</div>
</div>

<script src="script.js"></script>
</body>
</html>
