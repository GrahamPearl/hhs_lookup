<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cover Management Dashboard</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
<style>
body { background:#f4f6f9; margin:0; }

/* Left edge hover area indicator */
.sidebar-hover-trigger {
  position: fixed;
  left: 0;
  top: 0;
  width: 15px;
  height: 100vh;
  background: linear-gradient(90deg, #1e293b 0%, rgba(30, 41, 59, 0) 100%);
  z-index: 999;
  cursor: pointer;
  border-right: 2px solid #3b4c65;
  transition: width 0.2s ease-in-out;
}

.sidebar-hover-trigger:hover {
  width: 25px;
  background: linear-gradient(90deg, #334155 0%, rgba(30, 41, 59, 0) 100%);
}

.sidebar-hover-trigger::after {
  content: "☰";
  position: absolute;
  left: 2px;
  top: 20px;
  color: #94a3b8;
  font-size: 18px;
  font-weight: bold;
  opacity: 0.6;
}

.sidebar-hover-trigger:hover::after {
  opacity: 1;
  color: #cbd5e1;
}

.sidebar-container {
  position: fixed;
  left: -350px;
  top: 0;
  width: 350px;
  height: 100vh;
  background: #1e293b;
  color: white;
  padding: 15px;
  overflow-y: auto;
  transition: left 0.3s ease-in-out;
  z-index: 1000;
  box-shadow: 2px 0 10px rgba(0,0,0,0.2);
}

.sidebar-container:hover,
.sidebar-hover-trigger:hover ~ .sidebar-container {
  left: 0;
}

.sidebar-toggle {
  position: fixed;
  left: 0;
  top: 15px;
  width: 30px;
  height: 30px;
  background: #1e293b;
  color: white;
  border: none;
  cursor: pointer;
  border-radius: 0 4px 4px 0;
  z-index: 999;
  display: none;
}

.sidebar-container:hover ~ .sidebar-toggle {
  display: none;
}

@media (max-width: 992px) {
  .sidebar-toggle {
    display: block;
  }
}

.main-content {
  margin-left: 0;
  transition: margin-left 0.3s ease-in-out;
  padding: 20px;
}

.cell { border:1px solid #ccc; padding:10px; }
.free { background:#d1fae5; }
.lesson { background:#dbeafe; }
.meeting { background:#fef3c7; }
.avail-badge { cursor: grab; }
.assigned { background:#fde68a; }

.avail-badge {
  cursor: grab;
  font-size: 0.85em;
}
.avail-badge .badge {
  font-size: 0.7em;
}

.fairness-warning {
  background-color: #fff3cd;
  border-left: 4px solid #ff6b6b;
  padding: 10px;
  margin-bottom: 10px;
  border-radius: 4px;
}

@media print {
  .avail-badge {
    display: none;
  }
  .sidebar-container {
    display: none;
  }
  .sidebar-hover-trigger {
    display: none;
  }
  .floating-print-nav {
    display: none !important;
  }
}

.floating-print-nav {
  position: fixed;
  top: 20px;
  right: 0;
  width: 40px;
  height: auto;
  background: rgba(30, 41, 59, 0.95);
  border-radius: 8px 0 0 8px;
  overflow: hidden;
  z-index: 1100;
  box-shadow: -2px 2px 10px rgba(0,0,0,0.2);
  transition: width 0.2s ease-in-out;
}

.floating-print-nav:hover,
.floating-print-nav:focus-within {
  width: 210px;
}

.floating-print-handle {
  width: 40px;
  height: 40px;
  display: flex;
  align-items: center;
  justify-content: center;
  color: white;
  cursor: pointer;
  font-size: 18px;
  border-bottom: 1px solid rgba(255,255,255,0.15);
}

.floating-print-content {
  display: none;
  padding: 8px;
}

.floating-print-nav:hover .floating-print-content,
.floating-print-nav:focus-within .floating-print-content {
  display: block;
}

.floating-print-content button {
  font-size: 0.8em;
  text-align: left;
}

</style>
</head>
<body>

<!-- Left edge hover trigger -->
<div class="sidebar-hover-trigger" title="Hover to reveal sidebar"></div>

<div class="sidebar-container" id="sidebarContainer">
<div class="d-flex justify-content-between align-items-center mb-3">
  <h4 class="mb-0">Cover System</h4>
  <button class="btn btn-sm btn-light" onclick="document.getElementById('sidebarContainer').style.left='-350px'">✕</button>
</div>

<div class="mb-3">
	<label class="form-label">Cover Date</label>
	<input type="date" id="coverDate" class="form-control mb-2">
	<small class="text-muted">Week <span id="weekDisplay">1</span> of 10</small>
	<button class="btn btn-sm btn-outline-light w-100 mt-2" data-bs-toggle="modal" data-bs-target="#tenWeekModal">Manage Period</button>
</div>

<select id="absenceDaySelect" class="form-select mb-2">
	<option value="0">Day 1</option>
	<option value="1">Day 2</option>
	<option value="2">Day 3</option>
	<option value="3">Day 4</option>
	<option value="4">Day 5</option>
</select>

<h5 class="mt-3">Absent Teachers</h5>
<div class="input-group mb-2">
	<select id="addAbsenceTeacherSelect" class="form-select"></select>
	<button id="addAbsenceTeacherBtn" class="btn btn-primary">Add</button>
</div>

<table class="table table-bordered table-sm mb-2" id="absentTeachersTable">
	<thead>
		<tr><th>Teacher</th><th>Actions</th></tr>
	</thead>
	<tbody></tbody>
</table>

<div class="fairness-warning d-none" id="fairnessWarning"></div>

<button class="btn btn-primary w-100 mb-3" data-bs-toggle="modal" data-bs-target="#actionsModal">📋 Plan Actions</button>

<hr>

<h5>Data Management</h5>
<button id="bulkBtn" class="btn btn-outline-light w-100 mb-2" style="font-size:0.9em">Import Teachers</button>
<input type="file" id="bulkInput" webkitdirectory multiple class="d-none">
<div id="status" class="text-muted small mb-2"></div>

<button id="exportBtn" class="btn btn-outline-light w-100 mb-2" style="font-size:0.9em">Backup Data</button>
<input type="file" id="importMetricsInput" class="d-none">
<button id="importBtn" class="btn btn-outline-light w-100 mb-2" style="font-size:0.9em">Restore Data</button>
<button id="clearBtn" class="btn btn-danger w-100" style="font-size:0.9em">Clear All</button>

</div>

<button class="sidebar-toggle" onclick="document.getElementById('sidebarContainer').style.left='0'">☰</button>

<div class="main-content">

  <!-- Floating Print Navigation Menu -->
  <div id="floatingPrintNav" class="floating-print-nav no-print" tabindex="0" aria-label="Print Actions">
    <div class="floating-print-handle">🖨️</div>
    <div class="floating-print-content">
      <button id="navPrintBtn" class="btn btn-sm btn-light mb-1 w-100">Print</button>
      <button id="navPdfBtn" class="btn btn-sm btn-light mb-1 w-100">Save as PDF</button>
      <button id="navImgBtn" class="btn btn-sm btn-light mb-1 w-100">Save as Image</button>
      <button id="navEmailBtn" class="btn btn-sm btn-light w-100">Email</button>
    </div>
  </div>

  <h5>Cover Allocation</h5>
<div id="coverGrid"></div>
<h6 class="mt-4">Available Cover Teachers</h6>
<div id="availableCoverList" class="mb-3"></div>

</div>

<!-- Plan Actions Modal -->
<div class="modal fade" id="actionsModal" tabindex="-1">
	<div class="modal-dialog">
		<div class="modal-content">
			<div class="modal-header">
				<h5 class="modal-title">Plan Actions</h5>
				<button type="button" class="btn-close" data-bs-dismiss="modal"></button>
			</div>
			<div class="modal-body">
				<div class="d-grid gap-2">
					<button id="autoAssignBtn" class="btn btn-outline-dark btn-lg">🤖 Auto-Assign Fairly</button>
					<button id="saveBtn" class="btn btn-outline-dark btn-lg">💾 Save Plan</button>
					<button id="printBtn" class="btn btn-outline-dark btn-lg">🖨️ Print</button>
					<button id="exportExcelBtn" class="btn-outline-dark btn-lg">📊 Export to Excel</button>
					<button class="btn btn-outline-dark btn-lg" data-bs-toggle="modal" data-bs-target="#historyModal" data-bs-dismiss="modal">📜 View History</button>
					<hr>
					<div class="input-group">
						<input type="email" id="emailInput" class="form-control" placeholder="Email address">
						<button id="emailBtn" class="btn btn-outline-dark">📧 Send</button>
					</div>
				</div>
			</div>
		</div>
	</div>
</div>

<!-- View History Modal -->
<div class="modal fade" id="historyModal" tabindex="-1">
	<div class="modal-dialog modal-lg">
		<div class="modal-content">
			<div class="modal-header">
				<h5 class="modal-title">Cover History (10-Week Period)</h5>
				<button type="button" class="btn-close" data-bs-dismiss="modal"></button>
			</div>
			<div class="modal-body" id="historyModalBody">
				<table class="table table-striped table-sm">
					<thead>
						<tr><th>Date</th><th>Week</th><th>Absent</th><th>Cover</th><th>P</th><th>Subject</th></tr>
					</thead>
					<tbody id="historyTableBody"></tbody>
				</table>
			</div>
		</div>
	</div>
</div>

<!-- Ten Week Period Modal -->
<div class="modal fade" id="tenWeekModal" tabindex="-1">
	<div class="modal-dialog">
		<div class="modal-content">
			<div class="modal-header">
				<h5 class="modal-title">10-Week Period Settings</h5>
				<button type="button" class="btn-close" data-bs-dismiss="modal"></button>
			</div>
			<div class="modal-body">
				<div class="mb-3">
					<label class="form-label">Period Start Date</label>
					<input type="date" id="tenWeekStartDate" class="form-control">
					<small class="text-muted">The 10-week tracking period begins on this date</small>
				</div>
				<div class="alert alert-info">
					<strong>Current Status:</strong> <span id="periodStatus"></span>
				</div>
			</div>
			<div class="modal-footer">
				<button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
				<button type="button" class="btn btn-warning" id="resetPeriodBtn">Reset Period</button>
				<button type="button" class="btn btn-primary" id="savePeriodBtn">Save Changes</button>
			</div>
		</div>
	</div>
</div>

<!-- Print Preview Modal -->
<div class="modal fade" id="printPreviewModal" tabindex="-1" aria-labelledby="printPreviewLabel" aria-hidden="true">
	<div class="modal-dialog modal-lg">
		<div class="modal-content">
			<div class="modal-header">
				<h5 class="modal-title" id="printPreviewLabel">Print Preview</h5>
				<button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
			</div>
			<div class="modal-body" id="printArea"></div>
			<div class="modal-footer">
				<button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
				<button type="button" class="btn btn-primary" id="confirmPrintBtn">Print</button>
			</div>
		</div>
	</div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.2/js/bootstrap.bundle.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="script.js"></script>
</body>
</html>
