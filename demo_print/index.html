<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Teacher Print Queue - Booking System</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Manage teacher printing and photocopy requests with a shared queue system" />
    <!-- Bootstrap 4 CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css" />
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <div class="container py-3" style="max-width:760px;">
      <header class="d-flex align-items-center mb-3">
        <span class="mr-2" style="font-size:1.75rem;">🖨️</span>
        <h1 class="h4 mb-0 font-weight-bold">Teacher Print Queue</h1>
      </header>

      <!-- Role Selection -->
      <div class="card mb-3">
        <div class="card-body">
          <div class="form-group mb-2">
            <label for="roleSelect">User Role</label>
            <select id="roleSelect" class="form-control">
              <option value="requester">Requesting Teacher</option>
              <option value="admin">Admin</option>
              <option value="weekly-report">Weekly Report</option>
            </select>
          </div>

          <div id="weeklyReportControls" class="hidden">
            <div class="btn-group flex-wrap mt-2">
              <button id="saveWeeklyReportBtn" class="btn btn-outline-secondary btn-sm">📄 Weekly Report</button>
              <button id="saveMonthlyJsonBtn" class="btn btn-outline-secondary btn-sm">📦 Monthly JSON</button>
              <button id="saveTenWeekJsonBtn" class="btn btn-outline-secondary btn-sm">📦 10‑Week JSON</button>
            </div>
          </div>
        </div>
      </div>

      <!-- Admin Settings -->
      <div id="adminSettings" class="card mb-3 hidden">
        <div class="card-body">
          <h2 class="h5 font-weight-bold mb-3">⚙️ Admin Settings</h2>

          <div class="form-row">
            <div class="form-group col-md-6">
              <label for="teacherFile">Load teacher list (.txt)</label>
              <input type="file" id="teacherFile" accept=".txt" class="form-control-file" />
            </div>
            <div class="form-group col-md-6">
              <label for="authTeacherFile">Load authorising teachers (.txt)</label>
              <input type="file" id="authTeacherFile" accept=".txt" class="form-control-file" />
            </div>
          </div>
          <div class="form-row">
            <div class="form-group col-md-6">
              <label for="todoFile">Load unfinished jobs (.txt)</label>
              <input type="file" id="todoFile" accept=".txt" class="form-control-file" />
            </div>
            <div class="form-group col-md-6">
              <label for="teacherEmailFile">Load teacher emails (.txt)</label>
              <input type="file" id="teacherEmailFile" accept=".txt" class="form-control-file" />
            </div>
          </div>

          <div class="form-group">
            <label for="priorityMode">Queue prioritisation</label>
            <select id="priorityMode" class="form-control">
              <option value="fifo">First‑in, first‑out</option>
              <option value="due">Earliest due time</option>
              <option value="size">Smallest job first</option>
            </select>
          </div>

          <div class="form-row">
            <div class="form-group col-md-4">
              <label for="timePerPage">Time/page (s)</label>
              <input type="number" id="timePerPage" value="5" class="form-control" />
            </div>
            <div class="form-group col-md-4">
              <label for="loadTime">Load time (s)</label>
              <input type="number" id="loadTime" value="60" class="form-control" />
            </div>
            <div class="form-group col-md-4">
              <label for="checkTime">Check time (s)</label>
              <input type="number" id="checkTime" value="120" class="form-control" />
            </div>
          </div>

          <div class="form-row">
            <div class="form-group col-md-6">
              <label for="trimmingTime">Trimming time (s)</label>
              <input type="number" id="trimmingTime" value="0" class="form-control" />
            </div>
            <div class="form-group col-md-6">
              <label for="staplingTime">Stapling time (s)</label>
              <input type="number" id="staplingTime" value="0" class="form-control" />
            </div>
          </div>

          <div class="d-flex flex-wrap mt-2" style="gap:0.5rem;">
            <button id="saveTodoBtn" class="btn btn-outline-secondary btn-sm">💾 Save Unfinished</button>
            <button id="saveCompletedBtn" class="btn btn-outline-secondary btn-sm">💾 Save Completed</button>
            <button id="clearQueueBtn" class="btn btn-outline-danger btn-sm">🗑️ Clear Queue</button>
            <button id="clearStorageBtn" class="btn btn-outline-danger btn-sm">🗑️ Clear Storage</button>
          </div>
        </div>
      </div>

      <!-- New Print Request -->
      <div class="card mb-3">
        <div class="card-body">
          <h2 class="h5 font-weight-bold mb-3">🖨️ New Print Request</h2>

          <div class="form-row">
            <div class="form-group col-md-6">
              <label for="teacherSelect">Requesting teacher</label>
              <select id="teacherSelect" class="form-control" disabled>
                <option value="">No teachers loaded</option>
              </select>
            </div>
            <div class="form-group col-md-6">
              <label for="authTeacherSelect">Authorised by</label>
              <select id="authTeacherSelect" class="form-control" disabled>
                <option value="">No authorisers loaded</option>
              </select>
            </div>
          </div>

          <div class="form-row">
            <div class="form-group col-md-6">
              <label for="pages">Original pages</label>
              <input type="number" id="pages" class="form-control" />
            </div>
            <div class="form-group col-md-6">
              <label for="copies">Copies</label>
              <input type="number" id="copies" value="1" class="form-control" />
            </div>
          </div>

          <div class="form-row">
            <div class="form-group col-md-6">
              <label for="printType">Print type</label>
              <select id="printType" class="form-control">
                <option value="normal">Normal</option>
                <option value="twoinone">Two‑in‑One</option>
              </select>
            </div>
            <div class="form-group col-md-6">
              <label for="sides">Sides</label>
              <select id="sides" class="form-control">
                <option value="single">Single‑sided</option>
                <option value="double">Double‑sided</option>
              </select>
            </div>
          </div>

          <div class="form-row">
            <div class="form-group col-md-6">
              <label for="additionalTask">Additional tasks</label>
              <select id="additionalTask" class="form-control">
                <option value="none">None</option>
                <option value="trimming">Trimming</option>
                <option value="stapling">Stapling</option>
                <option value="trimming_stapling">Trimming and Stapling</option>
              </select>
            </div>
            <div class="form-group col-md-6">
              <label for="scheduledFor">Required by</label>
              <input type="datetime-local" id="scheduledFor" class="form-control" />
            </div>
          </div>

          <div class="alert alert-info py-2 mb-3">
            Effective pages: <strong><span id="effectivePages">0</span></strong> ·
            Estimated: <strong><span id="estimate">0</span></strong> seconds
          </div>

          <button id="submitBtn" class="btn btn-primary btn-block">Queue Print Job</button>
        </div>
      </div>

      <!-- Queue -->
      <div class="card mb-3">
        <div class="card-body">
          <h2 class="h5 font-weight-bold mb-3">📋 Print Queue <span id="jobCount" class="badge badge-secondary">0 jobs</span></h2>
          <div id="queue"></div>
        </div>
      </div>
    </div>

    <!-- Bootstrap 4 JS dependencies -->
    <script src="https://cdn.jsdelivr.net/npm/jquery@3.5.1/dist/jquery.slim.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/app.js"></script>
  </body>
</html>
