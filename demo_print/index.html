<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Teacher Print Queue - Booking System</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Manage teacher printing and photocopy requests with a shared queue system" />
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <div class="container">
      <header class="app-header">
        <div class="header-icon">🖨️</div>
        <h1>Teacher Print Queue</h1>
      </header>

      <!-- Role Selection -->
      <div class="card">
        <label>User Role</label>
        <select id="roleSelect">
          <option value="requester">Requesting Teacher</option>
          <option value="admin">Admin</option>
          <option value="weekly-report">Weekly Report</option>
        </select>

        <div id="weeklyReportControls" class="hidden">
          <div class="btn-row">
            <button id="saveWeeklyReportBtn" class="btn btn-outline">📄 Weekly Report</button>
            <button id="saveMonthlyJsonBtn" class="btn btn-outline">📦 Monthly JSON</button>
            <button id="saveTenWeekJsonBtn" class="btn btn-outline">📦 10‑Week JSON</button>
          </div>
        </div>
      </div>

      <!-- Admin Settings -->
      <div id="adminSettings" class="card hidden">
        <h2>⚙️ Admin Settings</h2>

        <div class="grid-2">
          <div>
            <label>Load teacher list (.txt)</label>
            <input type="file" id="teacherFile" accept=".txt" />
          </div>
          <div>
            <label>Load authorising teachers (.txt)</label>
            <input type="file" id="authTeacherFile" accept=".txt" />
          </div>
        </div>
        <div class="grid-2">
          <div>
            <label>Load unfinished jobs (.txt)</label>
            <input type="file" id="todoFile" accept=".txt" />
          </div>
          <div>
            <label>Load teacher emails (.txt)</label>
            <input type="file" id="teacherEmailFile" accept=".txt" />
          </div>
        </div>

        <label>Queue prioritisation</label>
        <select id="priorityMode">
          <option value="fifo">First‑in, first‑out</option>
          <option value="due">Earliest due time</option>
          <option value="size">Smallest job first</option>
        </select>

        <div class="grid-3">
          <div>
            <label>Time/page (s)</label>
            <input type="number" id="timePerPage" value="5" />
          </div>
          <div>
            <label>Load time (s)</label>
            <input type="number" id="loadTime" value="60" />
          </div>
          <div>
            <label>Check time (s)</label>
            <input type="number" id="checkTime" value="120" />
          </div>
        </div>

        <div class="grid-2">
          <div>
            <label>Trimming time (s)</label>
            <input type="number" id="trimmingTime" value="0" />
          </div>
          <div>
            <label>Stapling time (s)</label>
            <input type="number" id="staplingTime" value="0" />
          </div>
        </div>

        <div class="btn-row">
          <button id="saveTodoBtn" class="btn btn-outline">💾 Save Unfinished</button>
          <button id="saveCompletedBtn" class="btn btn-outline">💾 Save Completed</button>
          <button id="clearQueueBtn" class="btn btn-danger">🗑️ Clear Queue</button>
          <button id="clearStorageBtn" class="btn btn-danger">🗑️ Clear Storage</button>
        </div>
      </div>

      <!-- New Print Request -->
      <div class="card">
        <h2>🖨️ New Print Request</h2>

        <div class="grid-2">
          <div>
            <label>Requesting teacher</label>
            <select id="teacherSelect" disabled>
              <option value="">No teachers loaded</option>
            </select>
          </div>
          <div>
            <label>Authorised by</label>
            <select id="authTeacherSelect" disabled>
              <option value="">No authorisers loaded</option>
            </select>
          </div>
        </div>

        <div class="grid-2">
          <div>
            <label>Original pages</label>
            <input type="number" id="pages" />
          </div>
          <div>
            <label>Copies</label>
            <input type="number" id="copies" value="1" />
          </div>
        </div>

        <div class="grid-2">
          <div>
            <label>Print type</label>
            <select id="printType">
              <option value="normal">Normal</option>
              <option value="twoinone">Two‑in‑One</option>
            </select>
          </div>
          <div>
            <label>Sides</label>
            <select id="sides">
              <option value="single">Single‑sided</option>
              <option value="double">Double‑sided</option>
            </select>
          </div>
        </div>

        <div class="grid-2">
          <div>
            <label>Additional tasks</label>
            <select id="additionalTask">
              <option value="none">None</option>
              <option value="trimming">Trimming</option>
              <option value="stapling">Stapling</option>
              <option value="trimming_stapling">Trimming and Stapling</option>
            </select>
          </div>
          <div>
            <label>Required by</label>
            <input type="datetime-local" id="scheduledFor" />
          </div>
        </div>

        <div class="info-box">
          Effective pages: <strong><span id="effectivePages">0</span></strong> ·
          Estimated: <strong><span id="estimate">0</span></strong> seconds
        </div>

        <button id="submitBtn" class="btn btn-primary btn-full">Queue Print Job</button>
      </div>

      <!-- Queue -->
      <div class="card">
        <h2>📋 Print Queue <span id="jobCount" class="badge">0 jobs</span></h2>
        <div id="queue"></div>
      </div>
    </div>

    <script src="/app.js"></script>
  </body>
</html>
