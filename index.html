<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Hillcrest IT | Lookups</title>

  <!-- Bootstrap 5 (CSS) -->
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet"
    integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
    crossorigin="anonymous"
  />

  <link rel="stylesheet" href="./css/index.css">
</head>
<body>
  <!-- Navbar -->
  <nav class="navbar navbar-expand-md">
    <div class="container">
      <a class="navbar-brand fw-semibold" href="#">Hillcrest IT</a>
      <button class="navbar-toggler border-0" type="button" data-bs-toggle="collapse" data-bs-target="#navMain" aria-controls="navMain" aria-expanded="false" aria-label="Toggle navigation">
        <span class="navbar-toggler-icon" style="filter: invert(1);"></span>
      </button>
      <div class="collapse navbar-collapse" id="navMain">
        <ul class="navbar-nav ms-auto">
          <li class="nav-item"><a class="nav-link" href="#lookups">Lookups</a></li>
          <li class="nav-item"><a class="nav-link" href="https://www.hhs.co.za" target="_blank" rel="noopener">HHS Site</a></li>
        </ul>
      </div>
    </div>
  </nav>

  <!-- Hero -->
  <header class="hero">
    <div class="container">
      <div class="row align-items-center g-4">
        <div class="col-12 col-lg-8">
          <h1 class="display-5 fw-bold mb-3">HHS Student — Software Resources 2026</h1>
          <p class="lead mb-0">Quick access to the tools you use most. Choose a package to get started.</p>
        </div>
        <div class="col-12 col-lg-4 text-lg-end">
          <span class="badge rounded-pill bg-light text-dark px-3 py-2">
              Version 0.1.0 BETA - Tester
          </span>
        </div>
      </div>
    </div>
  </header>

  <!-- Action area -->
  <main class="py-5" id="lookups">
    <div class="container">
      <div class="row g-4" id="cards-container">
        <!-- Cards will be rendered here dynamically -->
      </div>
    </div>
  </main>

  <!-- Footer -->
  <footer class="py-4">
    <div class="container small">
      <div class="d-flex flex-column flex-md-row justify-content-between align-items-center gap-2">
        <div>&copy; <span id="year"></span> Hillcrest IT — Subject Head (Information Technology)</div>
        <div>
          <a class="text-decoration-none me-3" href="https://www.hhs.co.za" target="_blank" rel="noopener">Hillcrest High School</a>
          <a class="text-decoration-none" href="#">Back to top</a>
        </div>
      </div>
    </div>
  </footer>

  <!-- Bootstrap 5 (JS) -->
  <script
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
    crossorigin="anonymous"
  ></script>

  <script>
    // Update footer year
    document.getElementById('year').textContent = new Date().getFullYear();

    // Dynamically render cards from JSON
    fetch('./cards.json')
      .then(response => response.json())
      .then(cards => {
        const container = document.getElementById('cards-container');
        container.innerHTML = cards.map(card => `
          <div class="col-12 col-md-6">
            <div class="card action-card h-100">
              <div class="card-body p-4">
                <div class="d-flex align-items-start">
                  <div class="me-3">
                    <span class="badge ${card.badgeClass}">${card.badge}</span>
                  </div>
                  <div>
                    <h2 class="h4 mb-2">${card.title}</h2>
                    <p class="text-secondary mb-4">${card.description}</p>
                    <a class="btn ${card.buttonClass}" href="${card.link}">${card.buttonText}</a>
                  </div>
                </div>
              </div>
            </div>
          </div>
        `).join('');
      })
      .catch(error => {
        document.getElementById('cards-container').innerHTML = '<div class="col-12"><div class="alert alert-danger">Failed to load cards.</div></div>';
        console.error('Error loading cards.json:', error);
      });
  </script>
</body>
</html>
